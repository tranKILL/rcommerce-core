<h1 style="margin:0 0 12px 0;font-size:22px;line-height:1.3;color:#1a1a1a;">{{ t.heading }}</h1>
<p style="margin:0 0 24px 0;font-size:14px;line-height:1.6;color:#555555;">{{ t.intro }}</p>

<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="margin:0 0 8px 0;">
  {{ cart_items }}
</table>

<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="margin:8px 0 4px 0;">
  <tr>
    <td style="padding:10px 0 0 0;border-top:2px solid #1a1a1a;font-size:15px;font-weight:bold;color:#1a1a1a;">{{ t.total }}</td>
    <td align="right" style="padding:10px 0 0 0;border-top:2px solid #1a1a1a;font-size:15px;font-weight:bold;color:#1a1a1a;">{{ cart_total }}</td>
  </tr>
</table>
<p style="margin:0 0 24px 0;font-size:12px;line-height:1.6;color:#999999;">{{ price_note }}</p>

<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 24px 0;">
  <tr>
    <td align="center" bgcolor="{{ accent_color }}" style="border-radius:4px;">
      <a href="{{ cart_url }}" target="_blank" style="display:inline-block;padding:12px 28px;font-family:Helvetica,Arial,sans-serif;font-size:14px;font-weight:bold;color:#ffffff;text-decoration:none;">{{ t.button }}</a>
    </td>
  </tr>
</table>

<p style="margin:0;font-size:12px;line-height:1.6;color:#999999;">{{ t.why }} <a href="{{ unsubscribe_url }}" target="_blank" style="color:#999999;text-decoration:underline;">{{ t.unsubscribe }}</a></p>
