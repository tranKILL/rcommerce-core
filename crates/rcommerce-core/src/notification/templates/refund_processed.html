<h1 style="margin:0 0 12px 0;font-size:22px;line-height:1.3;color:#1a1a1a;">{{ t.heading }}</h1>
<p style="margin:0 0 24px 0;font-size:14px;line-height:1.6;color:#555555;">{{ t.intro }}</p>

<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="margin:0 0 24px 0;background-color:#f7f7f7;border:1px solid #ececec;">
  <tr>
    <td style="padding:16px;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
        <tr>
          <td width="34%" valign="top" style="padding-right:8px;">
            <div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#999999;padding-bottom:4px;">{{ t.refund_amount }}</div>
            <div style="font-size:14px;font-weight:bold;color:#ff4d00;">{{ refund_amount }}</div>
          </td>
          <td width="33%" valign="top" style="padding-right:8px;">
            <div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#999999;padding-bottom:4px;">{{ t.refund_method }}</div>
            <div style="font-size:14px;font-weight:bold;color:#1a1a1a;">{{ refund_method }}</div>
          </td>
          <td width="33%" valign="top">
            <div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#999999;padding-bottom:4px;">{{ t.processing_time }}</div>
            <div style="font-size:14px;font-weight:bold;color:#1a1a1a;">{{ processing_time }}</div>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>

<p style="margin:0;font-size:14px;line-height:1.6;color:#555555;">{{ t.bank_delay }}</p>
