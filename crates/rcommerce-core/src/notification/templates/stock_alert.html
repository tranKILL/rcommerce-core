<h1 style="margin:0 0 12px 0;font-size:22px;line-height:1.3;color:#1a1a1a;">{{ t.heading }}</h1>
<p style="margin:0 0 24px 0;font-size:14px;line-height:1.6;color:#555555;">{{ t.intro }}</p>

<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="margin:0 0 24px 0;border:1px solid #eeeeee;">
  <tr>
    <td style="padding:12px 16px;border-bottom:1px solid #eeeeee;">
      <div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#999999;padding-bottom:4px;">{{ t.branch }}</div>
      <div style="font-size:14px;line-height:1.6;color:#1a1a1a;">{{ location_name }}</div>
    </td>
  </tr>
  <tr>
    <td style="padding:12px 16px;">
      <div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#999999;padding-bottom:4px;">{{ t.available }}</div>
      <div style="font-size:14px;line-height:1.6;color:#1a1a1a;">{{ t.available_value }}</div>
    </td>
  </tr>
</table>

<p style="margin:0 0 24px 0;font-size:14px;line-height:1.6;color:#555555;">{{ t.hurry }}</p>

<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 16px 0;">
  <tr>
    <td align="center" bgcolor="{{ accent_color }}" style="border-radius:4px;">
      <a href="{{ product_url }}" target="_blank" style="display:inline-block;padding:12px 28px;font-family:Helvetica,Arial,sans-serif;font-size:14px;font-weight:bold;color:#ffffff;text-decoration:none;">{{ t.button }}</a>
    </td>
  </tr>
</table>

<p style="margin:0;font-size:12px;line-height:1.6;color:#999999;">{{ t.closed }}</p>
