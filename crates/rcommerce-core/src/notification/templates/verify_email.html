<h1 style="margin:0 0 12px 0;font-size:22px;line-height:1.3;color:#1a1a1a;">{{ t.heading }}</h1>
<p style="margin:0 0 24px 0;font-size:14px;line-height:1.6;color:#555555;">{{ t.intro }}</p>

<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 16px 0;">
  <tr>
    <td align="center" bgcolor="{{ accent_color }}" style="border-radius:4px;">
      <a href="{{ verification_url }}" target="_blank" style="display:inline-block;padding:12px 28px;font-family:Helvetica,Arial,sans-serif;font-size:14px;font-weight:bold;color:#ffffff;text-decoration:none;">{{ t.button }}</a>
    </td>
  </tr>
</table>

<p style="margin:0;font-size:13px;line-height:1.6;color:#777777;">{{ t.copy_link }}<br><span style="color:{{ accent_color }};word-break:break-all;">{{ verification_url }}</span></p>

<p style="margin:16px 0 0 0;font-size:13px;line-height:1.6;color:#777777;">{{ t.expires }}</p>
