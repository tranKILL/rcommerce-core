{{ company_name }}
'''

[order_ready_for_pickup]
subject = "A sua encomenda {{ order_number }} está pronta para levantamento"
heading = "A sua encomenda está pronta"
intro = "Olá {{ customer_name }}, a encomenda <strong>{{ order_number }}</strong> espera por si no balcão."
pickup_at = "Levantamento em"
bring = "Traga o número da encomenda. Quem levantar a encomenda indica o seu nome no balcão."
location_fallback = "o nosso armazém"
