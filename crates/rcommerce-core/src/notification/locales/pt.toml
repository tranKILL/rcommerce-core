[welcome]
subject = "Boas-vindas a {{ company_name }}!"
heading = "Boas-vindas a {{ company_name }}!"
intro = "Olá {{ customer_name }}, a sua conta foi criada e está pronta a usar. Faça compras, acompanhe as suas encomendas e gira a sua conta na sua área de cliente."
account_name = "Nome da conta"
active = "Ativa"
start_shopping = "Começar a comprar"
sign_in = "Inicie sessão na sua conta:"
text = '''
Olá {{ customer_name }},

Boas-vindas a {{ company_name }}! A sua conta está pronta.

Loja: {{ shop_url }}
Iniciar sessão: {{ login_url }}

{{ company_name }}
'''

[verify_email]
subject = "Confirme o seu endereço de e-mail"
heading = "Confirme o seu endereço de e-mail"
intro = "Olá {{ customer_name }}, obrigado por criar uma conta em {{ company_name }}. Confirme o seu endereço de e-mail para iniciar sessão."
button = "Confirmar o meu endereço de e-mail"
expires = "Esta ligação expira dentro de {{ expires_in }}. Se não criou esta conta, pode ignorar este e-mail."
text = '''
Olá {{ customer_name }},

Obrigado por criar uma conta em {{ company_name }}. Confirme o seu endereço de e-mail para iniciar sessão:

{{ verification_url }}

Esta ligação expira dentro de {{ expires_in }}. Se não criou esta conta, pode ignorar este e-mail.

{{ company_name }}
'''

[password_reset]
subject = "Redefinir a palavra-passe"
heading = "Redefinir a palavra-passe"
intro = "Olá {{ customer_name }}, recebemos um pedido para redefinir a sua palavra-passe."
security_notice = "Aviso de segurança"
security_text = "Se não fez este pedido, ignore este e-mail. A sua palavra-passe só muda quando usar a ligação abaixo."
expires = "Esta ligação expira dentro de {{ expires_in }}."
button = "Redefinir a palavra-passe"
text = '''
Olá {{ customer_name }},

Recebemos um pedido para redefinir a sua palavra-passe.

Redefinir a palavra-passe: {{ reset_url }}

Esta ligação expira dentro de {{ expires_in }}. Se não fez este pedido, pode ignorar este e-mail.

{{ company_name }}
'''

[order_confirmation]
subject = "Encomenda confirmada: {{ order_number }}"
order_label = "Encomenda {{ order_number }}"
heading = "Obrigado pela sua encomenda, {{ customer_name }}!"
intro = "Recebemos a sua encomenda e estamos a prepará-la. O resumo da encomenda segue em anexo em PDF."
text = '''
Olá {{ customer_name }},

Obrigado pela sua encomenda! A encomenda {{ order_number }} está confirmada.

Detalhes da encomenda:
----------------
Subtotal: {{ subtotal }}
{{ discount_line }}Entrega: {{ shipping_cost }}
IVA: {{ tax }}
Total: {{ order_total }}

O resumo da encomenda segue em anexo em PDF.

Voltaremos a escrever-lhe quando a encomenda estiver pronta.

Com os melhores cumprimentos,
A equipa {{ company_name }}
'''

[admin_new_order]
subject = "Nova encomenda: {{ order_number }}"
new_order = "Nova encomenda"
customer = "Cliente:"
text = '''
Nova encomenda {{ order_number }}

Cliente: {{ customer_name }} ({{ customer_email }})

Total da encomenda: {{ order_total }}

Morada de entrega:
{{ shipping_address_text }}
'''

