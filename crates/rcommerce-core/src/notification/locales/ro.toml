# Textele e-mailurilor în română. Structura: vezi en.toml; un text care lipsește
# aici este trimis în engleză.

[common]
questions = "Întrebări?"
footer_note = ""
customer_fallback = "stimate client"
order_number = "Număr comandă"
order_date = "Data comenzii"
total = "Total"
status = "Stare"
subtotal = "Subtotal"
shipping = "Livrare"
tax = "TVA"
discount = "Reducere"
discount_code = "Reducere ({code})"
item = "Articol"
qty = "Cant."
price = "Preț"
sku = "Cod"
shipping_address = "Adresa de livrare"
billing_address = "Adresa de facturare"
refund_amount = "Suma rambursată"
copy_link = "Sau copiați acest link în browser:"
date_format = "{day} {month} {year}"
months = ["ianuarie", "februarie", "martie", "aprilie", "mai", "iunie", "iulie", "august", "septembrie", "octombrie", "noiembrie", "decembrie"]
money_format = "{amount} {symbol}"
decimal_separator = ","
thousands_separator = "."
hours = "{n} de ore"
one_hour = "{n} oră"

[welcome]
subject = "Bine ați venit la {{ company_name }}!"
heading = "Bine ați venit la {{ company_name }}!"
intro = "Bună ziua, {{ customer_name }}, contul dumneavoastră a fost creat și este gata de folosit. Cumpărați, urmăriți comenzile și gestionați contul din zona de client."
account_name = "Numele contului"
active = "Activ"
start_shopping = "Începeți cumpărăturile"
sign_in = "Conectați-vă la cont:"
text = '''
Bună ziua, {{ customer_name }},

Bine ați venit la {{ company_name }}! Contul dumneavoastră este gata.

Magazin: {{ shop_url }}
Conectare: {{ login_url }}

{{ company_name }}
'''

[verify_email]
subject = "Confirmați adresa de e-mail"
heading = "Confirmați adresa de e-mail"
intro = "Bună ziua, {{ customer_name }}, vă mulțumim că v-ați creat un cont la {{ company_name }}. Confirmați adresa de e-mail pentru a vă conecta."
button = "Confirm adresa de e-mail"
expires = "Acest link expiră în {{ expires_in }}. Dacă nu ați creat acest cont, ignorați acest e-mail."
text = '''
Bună ziua, {{ customer_name }},

Vă mulțumim că v-ați creat un cont la {{ company_name }}. Confirmați adresa de e-mail pentru a vă conecta:

{{ verification_url }}

Acest link expiră în {{ expires_in }}. Dacă nu ați creat acest cont, ignorați acest e-mail.

{{ company_name }}
'''

[password_reset]
subject = "Resetarea parolei"
heading = "Resetarea parolei"
intro = "Bună ziua, {{ customer_name }}, am primit o cerere de resetare a parolei dumneavoastră."
security_notice = "Notă de securitate"
security_text = "Dacă nu ați cerut resetarea, ignorați acest e-mail. Parola nu se schimbă până nu folosiți linkul de mai jos."
expires = "Acest link expiră în {{ expires_in }}."
button = "Resetează parola"
text = '''
Bună ziua, {{ customer_name }},

Am primit o cerere de resetare a parolei dumneavoastră.

Resetați parola: {{ reset_url }}

Acest link expiră în {{ expires_in }}. Dacă nu ați cerut acest lucru, ignorați acest e-mail.

{{ company_name }}
'''

[order_confirmation]
subject = "Comandă confirmată: {{ order_number }}"
order_label = "Comanda {{ order_number }}"
heading = "Vă mulțumim pentru comandă, {{ customer_name }}!"
intro = "Am primit comanda dumneavoastră și o pregătim. Rezumatul comenzii este atașat la acest e-mail în format PDF."
text = '''
Bună ziua, {{ customer_name }},

Vă mulțumim pentru comandă! Comanda {{ order_number }} este confirmată.

Detaliile comenzii:
----------------
Subtotal: {{ subtotal }}
{{ discount_line }}Livrare: {{ shipping_cost }}
TVA: {{ tax }}
Total: {{ order_total }}

Rezumatul comenzii este atașat la acest e-mail în format PDF.

Vă vom scrie din nou când comanda va fi gata.

Cu stimă,
Echipa {{ company_name }}
'''

[admin_new_order]
subject = "Comandă nouă: {{ order_number }}"
new_order = "Comandă nouă"
customer = "Client:"
text = '''
Comandă nouă {{ order_number }}

Client: {{ customer_name }} ({{ customer_email }})

Totalul comenzii: {{ order_total }}

Adresa de livrare:
{{ shipping_address_text }}
'''

[order_shipped]
subject = "Comanda dumneavoastră este pe drum: {{ order_number }}"
heading = "Comanda dumneavoastră este pe drum!"
intro = "Bună ziua, {{ customer_name }}, vești bune: comanda <strong>{{ order_number }}</strong> este pe drum spre dumneavoastră."
carrier = "Curier"
in_transit = "Pe drum"
tracking_number = "Număr de urmărire:"
track_button = "Urmăriți coletul"
text = '''
Bună ziua, {{ customer_name }},

Vești bune! Comanda {{ order_number }} este pe drum.

Număr de urmărire: {{ tracking_number }}
Curier: {{ shipping_carrier }}

Urmăriți coletul: {{ tracking_url }}

{{ company_name }}
'''

[order_ready_for_pickup]
subject = "Comanda {{ order_number }} este gata de ridicare"
heading = "Comanda dumneavoastră este gata"
intro = "Bună ziua, {{ customer_name }}, comanda <strong>{{ order_number }}</strong> vă așteaptă la ghișeu."
pickup_at = "Ridicare de la"
bring = "Aveți la dumneavoastră numărul comenzii. Persoana care ridică comanda își spune numele la ghișeu."
location_fallback = "depozitul nostru"
text = '''
Bună ziua, {{ customer_name }},

Comanda {{ order_number }} este gata de ridicare de la {{ location_name }}.

Aveți la dumneavoastră numărul comenzii. Persoana care ridică comanda își spune numele la ghișeu.

{{ company_name }}
'''

[order_cancelled]
subject = "Comanda {{ order_number }} a fost anulată"
greeting = "Bună ziua,"
cancelled = "Comanda {{ order_number }} a fost anulată."
sorry = "Ne pare rău pentru neplăcere. Pentru orice întrebare, răspundeți la acest e-mail."
refunded = "Orice plată deja încasată a fost rambursată prin metoda de plată inițială."

[refund_processed]
subject = "Rambursare efectuată: {{ order_number }}"
heading = "Rambursarea a fost efectuată"
intro = "Bună ziua, {{ customer_name }}, rambursarea pentru comanda <strong>{{ order_number }}</strong> este în curs."
refund_method = "Metoda de rambursare"
processing_time = "Termen"
bank_delay = "În funcție de bancă, suma poate apărea în cont după câteva zile lucrătoare."
original_method = "Metoda de plată inițială"
business_days = "5-10 zile lucrătoare"
text = '''
Bună ziua, {{ customer_name }},

Rambursarea pentru comanda {{ order_number }} a fost efectuată.

Suma rambursată: {{ refund_amount }}
Metoda de rambursare: {{ refund_method }}
Termen: {{ processing_time }}

{{ company_name }}
'''

