[welcome]
subject = "Willkommen bei {{ company_name }}!"
heading = "Willkommen bei {{ company_name }}!"
intro = "Hallo {{ customer_name }}, Ihr Konto ist eingerichtet und einsatzbereit. Kaufen Sie ein, verfolgen Sie Ihre Bestellungen und verwalten Sie Ihr Konto in Ihrem Kundenbereich."
account_name = "Kontoname"
active = "Aktiv"
start_shopping = "Jetzt einkaufen"
sign_in = "Melden Sie sich bei Ihrem Konto an:"
text = '''
Hallo {{ customer_name }},

willkommen bei {{ company_name }}! Ihr Konto ist bereit.

Shop: {{ shop_url }}
Anmelden: {{ login_url }}

{{ company_name }}
'''

[verify_email]
subject = "Bestätigen Sie Ihre E-Mail-Adresse"
heading = "Bestätigen Sie Ihre E-Mail-Adresse"
intro = "Hallo {{ customer_name }}, vielen Dank für Ihre Registrierung bei {{ company_name }}. Bestätigen Sie Ihre E-Mail-Adresse, um sich anzumelden."
button = "E-Mail-Adresse bestätigen"
expires = "Dieser Link ist {{ expires_in }} gültig. Wenn Sie dieses Konto nicht angelegt haben, können Sie diese E-Mail ignorieren."
text = '''
Hallo {{ customer_name }},

vielen Dank für Ihre Registrierung bei {{ company_name }}. Bestätigen Sie Ihre E-Mail-Adresse, um sich anzumelden:

{{ verification_url }}

Dieser Link ist {{ expires_in }} gültig. Wenn Sie dieses Konto nicht angelegt haben, können Sie diese E-Mail ignorieren.

{{ company_name }}
'''

[password_reset]
subject = "Passwort zurücksetzen"
heading = "Passwort zurücksetzen"
intro = "Hallo {{ customer_name }}, wir haben eine Anfrage zum Zurücksetzen Ihres Passworts erhalten."
security_notice = "Sicherheitshinweis"
security_text = "Wenn Sie das nicht angefordert haben, ignorieren Sie diese E-Mail. Ihr Passwort ändert sich erst, wenn Sie den Link unten verwenden."
expires = "Dieser Link ist {{ expires_in }} gültig."
button = "Passwort zurücksetzen"
text = '''
Hallo {{ customer_name }},

wir haben eine Anfrage zum Zurücksetzen Ihres Passworts erhalten.

Passwort zurücksetzen: {{ reset_url }}

Dieser Link ist {{ expires_in }} gültig. Wenn Sie das nicht angefordert haben, können Sie diese E-Mail ignorieren.

{{ company_name }}
'''

[order_confirmation]
subject = "Bestellung bestätigt: {{ order_number }}"
order_label = "Bestellung {{ order_number }}"
heading = "Vielen Dank für Ihre Bestellung, {{ customer_name }}!"
intro = "Wir haben Ihre Bestellung erhalten und bereiten sie vor. Die Bestellübersicht finden Sie als PDF im Anhang."
text = '''
Hallo {{ customer_name }},

vielen Dank für Ihre Bestellung! Ihre Bestellung {{ order_number }} ist bestätigt.

Bestelldetails:
----------------
Zwischensumme: {{ subtotal }}
{{ discount_line }}Lieferung: {{ shipping_cost }}
MwSt.: {{ tax }}
Gesamt: {{ order_total }}

Die Bestellübersicht finden Sie als PDF im Anhang.

Wir melden uns wieder, sobald Ihre Bestellung bereit ist.

Mit freundlichen Grüßen
Ihr Team von {{ company_name }}
'''

[admin_new_order]
subject = "Neue Bestellung: {{ order_number }}"
new_order = "Neue Bestellung"
customer = "Kunde:"
text = '''
Neue Bestellung {{ order_number }}

Kunde: {{ customer_name }} ({{ customer_email }})

Bestellsumme: {{ order_total }}

Lieferadresse:
{{ shipping_address_text }}
'''

