# E-mailteksten in het Nederlands. Zie en.toml voor de opbouw; een tekst die
# hier ontbreekt, wordt in het Engels verstuurd.

[common]
questions = "Vragen?"
footer_note = ""
customer_fallback = "klant"
order_number = "Bestelnummer"
order_date = "Besteldatum"
total = "Totaal"
status = "Status"
subtotal = "Subtotaal"
shipping = "Levering"
tax = "Btw"
discount = "Korting"
discount_code = "Korting ({code})"
item = "Artikel"
qty = "Aantal"
price = "Prijs"
sku = "Ref."
shipping_address = "Leveringsadres"
billing_address = "Factuuradres"
refund_amount = "Terugbetaald bedrag"
copy_link = "Of kopieer deze link in uw browser:"
date_format = "{day} {month} {year}"
months = ["januari", "februari", "maart", "april", "mei", "juni", "juli", "augustus", "september", "oktober", "november", "december"]
money_format = "{symbol} {amount}"
